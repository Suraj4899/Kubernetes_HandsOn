apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: employee-mysql:latest
        imagePullPolicy: Never  # Use local image
        ports:
        - containerPort: 3306
          name: mysql
        envFrom:
        - configMapRef:
            name: emp-app-config
        - secretRef:
            name: emp-db-secret
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        emptyDir: {}  # For demo purposes; use PersistentVolume in production